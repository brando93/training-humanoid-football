# Fase 3a: clips de CMU Motion Capture (http://mocap.cs.cmu.edu, uso libre: "may be copied, modified,
# or redistributed without permission") para probar cada función básica del futbolista en MuJoCo.
# Excluidos: sujeto 143 en carrera (niño de 1,38 m: al escalarlo a adulto corre a ~6,7 m/s) y clips de
# menos de 1 s que empiezan en plena carrera. Ver docs/reports/battery_3a.md.
