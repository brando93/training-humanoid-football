# Checklist de habilidades (fuente de docs/checklist_habilidades.md). Orden de prioridad de Brandon:
#   Etapa 1: moverse como un humano, de forma natural, con acciones básicas.
#   Etapa 2: movimiento atlético orientado al fútbol (sin balón).
#   Etapa 3: el balón.
# No se pasa a una etapa sin dominar la anterior.
#
# Los checks NO se ponen a mano: los marca retarget/update_checklist.py desde mediciones en MuJoCo.
# Una habilidad tiene check solo si cumple las DOS columnas:
#   "Lo hace":  imita sus clips con 100% de éxito en todas las corridas (>= 5 por clip) y error medio < 10 cm.
#   "Natural":  se mueve como un humano real, medido con física (ver docs/plan.md, "Naturalidad"):
#               pies que no patinan, suavidad comparable al humano real, fuerzas articulares y de contacto
#               en rangos humanos, y la nota visual de Brandon. Evaluador en construcción.
#
# eval: nombre de la habilidad en configs/skills_cmu.yaml (null = todavía sin clips ni prueba).
etapa_1_movimiento_humano:
  postura_y_equilibrio:
    - {id: de_pie, nombre: "Estar de pie quieto, relajado", eval: null}
    - {id: un_pie, nombre: "Equilibrio en un pie", eval: un_pie}
    - {id: agacharse, nombre: "Agacharse y volver a erguirse", eval: null}
  caminar:
    - {id: caminar, nombre: "Caminar hacia adelante", eval: null}
    - {id: caminar_atras, nombre: "Caminar hacia atrás", eval: hacia_atras}
    - {id: caminar_lateral, nombre: "Pasos laterales", eval: lateral_defensivo}
    - {id: girar_en_sitio, nombre: "Girar en el sitio", eval: null}
    - {id: caminar_girando, nombre: "Caminar cambiando de dirección", eval: null}
  correr:
    - {id: trotar, nombre: "Trotar", eval: null}
    - {id: correr, nombre: "Correr", eval: correr_recto}
    - {id: arrancar, nombre: "Arrancar desde quieto", eval: arrancar}
    - {id: frenar, nombre: "Frenar hasta quedar quieto", eval: frenar_en_seco}
  saltar:
    - {id: saltar_dos_pies, nombre: "Saltar con los dos pies", eval: dos_pies}
  suelo:
    - {id: levantarse, nombre: "Levantarse del suelo", eval: levantarse}
    - {id: caer_seguro, nombre: "Caer sin dañarse y recuperarse", eval: null}

etapa_2_atletico_futbol:
  velocidad:
    - {id: sprint, nombre: "Esprintar", eval: null}
    - {id: trote_a_carrera, nombre: "Pasar de trote a carrera", eval: trote_a_carrera}
    - {id: correr_parar_correr, nombre: "Correr, parar y volver a correr", eval: correr_parar_correr}
  agilidad:
    - {id: corte_90_trote, nombre: "Corte de 90° trotando", eval: corte_90_trote}
    - {id: corte_90_carrera, nombre: "Corte de 90° corriendo", eval: corte_90_carrera}
    - {id: giro_corriendo, nombre: "Giro corriendo", eval: giro_corriendo}
    - {id: lateral_corriendo, nombre: "Desplazamiento lateral rápido", eval: lateral_corriendo}
  saltos:
    - {id: salto_con_carrera, nombre: "Salto con carrera", eval: con_carrera}
    - {id: saltos_un_pie, nombre: "Saltos en un pie", eval: saltos_un_pie}
    - {id: cabecear_salto, nombre: "Saltar para cabecear", eval: null}
  gesto:
    - {id: gesto_patada, nombre: "Gesto de patada de fútbol (sin balón)", eval: patear_balon_futbol}

etapa_3_balon:
  fisica:
    - {id: F, nombre: "Física del balón validada (rebote, rodamiento, aire, efecto)", eval: null}
  basicas_B0_B5:
    - {id: B0, nombre: "Moverse alrededor del balón sin pisarlo ni tropezar", eval: null}
    - {id: B1, nombre: "Tocar con la zona del pie que se pide", eval: null}
    - {id: B2, nombre: "Pisar y controlar 3 s sin caer", eval: null}
    - {id: B3, nombre: "Primer control: el balón queda a < 1 m", eval: null}
    - {id: B4, nombre: "Empujar con toques cortos (dirección < 15°)", eval: null}
    - {id: B5, nombre: "Patear balón quieto (dirección < 10°, velocidad ±15%)", eval: null}
  juego_B6_B9:
    - {id: B6, nombre: "Conducir 20 m caminando y trotando", eval: null}
    - {id: B7, nombre: "Recibir y pasar (a < 1 m del objetivo)", eval: null}
    - {id: B8, nombre: "Tiro a portería con la fuerza pedida", eval: null}
    - {id: B9, nombre: "Jugada completa: conducir, controlar, tirar", eval: null}
