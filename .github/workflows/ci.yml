name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Instalar gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/
      - name: Buscar secretos en todo el historial
        run: gitleaks git --redact --verbose .

  shell-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck scripts/*.sh infra/packer/scripts/*.sh

  infra-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.17.2"
      - name: terraform fmt
        run: terraform fmt -check -recursive infra/terraform
      - name: terraform validate (sin backend ni credenciales)
        run: |
          for d in infra/terraform/bootstrap infra/terraform/base; do
            terraform -chdir="$d" init -backend=false -input=false >/dev/null
            terraform -chdir="$d" validate
          done
      - uses: hashicorp/setup-packer@v3
        with:
          version: "1.16.2"
      - name: packer fmt y validate (solo sintaxis)
        working-directory: infra/packer
        run: |
          packer init .
          packer fmt -check .
          packer validate -syntax-only .
