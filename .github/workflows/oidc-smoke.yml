# Prueba manual: GitHub Actions asume un rol de AWS por OIDC, sin ningún secreto guardado.
name: oidc-smoke

on:
  workflow_dispatch:

permissions:
  id-token: write   # necesario para pedir el token OIDC
  contents: read

jobs:
  whoami:
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::611606529792:role/humanoid-gha-smoke
          aws-region: us-east-1
      - name: ¿Quién soy en AWS?
        run: aws sts get-caller-identity
